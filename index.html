    <title>Gaël Sassan — Software Developer</title>
    <style>
      #loading-screen {
        position: fixed; inset: 0; z-index: 99999;
        background: #05060A;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #loading-screen.hidden { opacity: 0; visibility: hidden; }
      #boot {
        font-family: 'JetBrains Mono', monospace; font-size: 12px;
        color: #5A6572; line-height: 2;
      }
      #boot .ln { opacity: 0; animation: bl 0.1s forwards; }
      #boot .ln:nth-child(1) { animation-delay: 0.2s; }
      #boot .ln:nth-child(2) { animation-delay: 0.7s; }
      #boot .ln:nth-child(3) { animation-delay: 1.2s; }
      #boot .ok { color: #00E5FF; }
      #boot .cursor { display: inline-block; width: 7px; height: 13px; background: #00E5FF; vertical-align: middle; animation: bk 1s steps(2) infinite; }
      @keyframes bl { to { opacity: 1; } }
      @keyframes bk { 50% { opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div id="boot">
        <div class="ln">&gt; boot gs.dev --env=production <span class="ok">[OK]</span></div>
        <div class="ln">&gt; mounting modules: flutter react cloud <span class="ok">[OK]</span></div>
        <div class="ln">&gt; initializing interface... <span class="cursor"></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
